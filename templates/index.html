<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Audio Search System</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="container py-5">

    <!-- ===================================== -->

    <!-- Header -->

    <!-- ===================================== -->

    <div class="text-center mb-5">

        <h1>

            🎵 AI Audio Search System

        </h1>

        <p class="text-secondary">

            Semantic Audio Search using WavLM + FAISS + DTW

        </p>

    </div>



    <div class="row g-4">

        <!-- ===================================== -->

        <!-- Upload Card -->

        <!-- ===================================== -->

        <div class="col-lg-6">

            <div class="card shadow-lg h-100">

                <div class="card-body">

                    <h3>

                        <i class="fa-solid fa-upload"></i>

                        Upload Media

                    </h3>

                    <hr>

                    <input

                        type="file"

                        id="mediaFile"

                        class="form-control"

                    >

                    <button

                        id="uploadBtn"

                        class="btn btn-primary mt-3 w-100"

                    >

                        Upload

                    </button>

                    <button

                        id="buildBtn"

                        class="btn btn-dark mt-3 w-100"

                    >

                        Build Index

                    </button>

                </div>

            </div>

        </div>



        <!-- ===================================== -->

        <!-- Progress Card -->

        <!-- ===================================== -->

        <div class="col-lg-6">

            <div class="card shadow-lg h-100">

                <div class="card-body">

                    <h3>

                        <i class="fa-solid fa-microchip"></i>

                        Index Progress

                    </h3>

                    <hr>

                    <div class="progress mb-4">

                        <div

                            id="progressBar"

                            class="progress-bar progress-bar-striped progress-bar-animated"

                            style="width:0%;"

                        >

                            0%

                        </div>

                    </div>

                    <table class="table">

                        <tbody>

                            <tr>

                                <th>Status</th>

                                <td id="status">

                                    Ready

                                </td>

                            </tr>

                            <tr>

                                <th>Current File</th>

                                <td id="currentFile">

                                    -

                                </td>

                            </tr>

                            <tr>

                                <th>Chunk</th>

                                <td id="chunk">

                                    -

                                </td>

                            </tr>

                            <tr>

                                <th>ETA</th>

                                <td id="eta">

                                    --:--

                                </td>

                            </tr>

                            <tr>

                                <th>Speed</th>

                                <td id="speed">

                                    -

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>



    <!-- ===================================== -->

    <!-- Search -->

    <!-- ===================================== -->

    <div class="card shadow-lg mt-5">

        <div class="card-body">

            <h3>

                <i class="fa-solid fa-magnifying-glass"></i>

                Search Audio

            </h3>

            <hr>

            <input

                id="queryFile"

                type="file"

                class="form-control"

            >

            <button

                id="searchBtn"

                class="btn btn-success mt-3"

            >

                Search

            </button>

        </div>

    </div>



    <!-- ===================================== -->

    <!-- Results -->

    <!-- ===================================== -->

    <div class="card shadow-lg mt-5">

        <div class="card-body">

            <h3>

                <i class="fa-solid fa-file-audio"></i>

                Search Result

            </h3>

            <hr>

            <table class="table">

                <tbody>

                    <tr>

                        <th>Matched File</th>

                        <td id="resultFile">

                            -

                        </td>

                    </tr>

                    <tr>

                        <th>Start</th>

                        <td id="resultStart">

                            -

                        </td>

                    </tr>

                    <tr>

                        <th>End</th>

                        <td id="resultEnd">

                            -

                        </td>

                    </tr>

                    <tr>

                        <th>Similarity</th>

                        <td id="resultSimilarity">

                            -

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
